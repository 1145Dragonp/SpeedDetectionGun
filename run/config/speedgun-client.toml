#HUD 面板位置：左上/中上/右上/左下/中下/右下
corner = "TOP_CENTER"
#边框/标题颜色（ARGB 十进制整数；如 0xFF00E676 = 4278236790）
accentColor = -16718218
#背景透明度（0~255，255 完全不透明，0 全透明）
# Default: 192
# Range: 0 ~ 255
backgroundAlpha = 72
#是否显示总速度行
show3D = true
#是否显示水平速度行
showHorizontal = true
#是否显示垂直速度行
showVertical = true
#是否显示状态行
showState = true
#是否显示峰值行
showPeak = true
#总速度行是否显示 km/h 换算
kmph3D = true
#水平速度行是否显示 km/h 换算
kmphHorizontal = true
#垂直速度行是否显示 km/h 换算
kmphVertical = true
#峰值行是否显示 km/h 换算
kmphPeak = true
